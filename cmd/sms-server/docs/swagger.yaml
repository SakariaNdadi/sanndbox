basePath: /
definitions:
  main.EvaluationCriterion:
    properties:
      category:
        type: string
      details:
        type: string
      status:
        $ref: '#/definitions/main.EvaluationStatus'
      target:
        type: string
    type: object
  main.EvaluationStatus:
    enum:
    - PASS
    - WARN
    - FAIL
    type: string
    x-enum-varnames:
    - StatusPass
    - StatusWarn
    - StatusFail
  main.SMSEvaluationReport:
    properties:
      criteria:
        items:
          $ref: '#/definitions/main.EvaluationCriterion'
        type: array
      encoding:
        type: string
      overallStatus:
        $ref: '#/definitions/main.EvaluationStatus'
      perSegmentLimit:
        type: integer
      segmentCount:
        type: integer
      totalUnits:
        type: integer
    type: object
  main.SMSRecord:
    properties:
      id:
        type: string
      message:
        type: string
      recipient:
        type: string
      report:
        $ref: '#/definitions/main.SMSEvaluationReport'
      sender:
        type: string
      sessionId:
        type: string
      source:
        type: string
      timestamp:
        type: string
    type: object
  main.SMSSubmissionRequest:
    properties:
      message:
        type: string
      recipient:
        type: string
      sender:
        type: string
      sessionId:
        type: string
    type: object
info:
  contact: {}
  description: HTTP (:8082) SMS Sanndbox with GSM-7 and UCS-2 Encoding and Segmentation
    Evaluation Engine.
  title: SMS Sanndbox API
  version: 1.0.0
paths:
  /:
    get:
      produces:
      - text/html
      responses:
        "200":
          description: HTML Dashboard
          schema:
            type: string
      summary: Render SMS Sanndbox Dashboard
  /api/v1/sms:
    get:
      parameters:
      - description: Browser Tab Session ID
        in: query
        name: sessionId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.SMSRecord'
            type: array
      summary: List evaluated SMS records
    post:
      consumes:
      - application/json
      parameters:
      - description: SMS Submission Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.SMSSubmissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.SMSRecord'
      summary: Submit SMS for GSM-7/UCS-2 evaluation
  /api/v1/sms/clear:
    post:
      parameters:
      - description: Browser Tab Session ID
        in: query
        name: sessionId
        type: string
      - description: Delete every message on this channel
        in: query
        name: all
        type: boolean
      responses:
        "204":
          description: Cleared
          schema:
            type: string
      summary: Clear cached SMS messages
  /docs:
    get:
      produces:
      - text/html
      responses:
        "200":
          description: Swagger UI HTML
          schema:
            type: string
      summary: Interactive OpenAPI 3.0 Documentation
  /events:
    get:
      parameters:
      - description: Browser Tab Session ID
        in: query
        name: sessionId
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE Stream
          schema:
            type: string
      summary: Real-time HTMX SSE stream
swagger: "2.0"
