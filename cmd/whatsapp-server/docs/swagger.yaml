info:
  contact: {}
  description: Meta WhatsApp Business Platform Sanndbox (:9083) modeled after fbsamples/whatsapp-business-jaspers-market/services.
    Implements Graph API /{apiVersion}/{phoneNumberId}/messages, /{wabaId}/message_templates,
    /{phoneNumberId}/media, /webhook (GET verify + POST X-Hub-Signature-256), entry_source_attributed
    telemetry, 15s status follow-up cache, WABA Setup & .env generator, and Template
    Studio.
  title: WhatsApp Business Cloud API & Jasper's Market Sanndbox
  version: 2.0.0
paths:
  /:
    get:
      produces:
      - text/html
      responses:
        "200":
          description: HTML Dashboard
          schema:
            type: string
      summary: Render WhatsApp Business & Jasper's Market Sanndbox UI
  /{apiVersion}/{phoneNumberId}/messages:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Graph API Send Message endpoint (/{apiVersion}/{phoneNumberId}/messages)
  /api/v1/whatsapp:
    get:
      parameters:
      - description: Browser Tab Session ID
        in: query
        name: sessionId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.IMRecord'
            type: array
      summary: List evaluated WhatsApp records
    post:
      consumes:
      - application/json
      parameters:
      - description: WhatsApp Submission Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.IMSubmissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.IMRecord'
      summary: Submit WhatsApp payload for Cloud API constraint evaluation
  /api/v1/whatsapp/clear:
    post:
      parameters:
      - description: Browser Tab Session ID
        in: query
        name: sessionId
        type: string
      - description: Delete every message on this channel
        in: query
        name: all
        type: boolean
      responses:
        "204":
          description: Cleared
          schema:
            type: string
      summary: Clear cached WhatsApp messages
  /api/v1/whatsapp/config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.WABASanndboxConfig'
      summary: Get WABA Setup Configuration & .env status
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.WABASanndboxConfig'
      summary: Update WABA Setup Configuration & validate media IDs
  /api/v1/whatsapp/interact:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.IMRecord'
            type: array
      summary: Trigger Jasper's Market Conversation Bot flow or Status Receipt
  /api/v1/whatsapp/media:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.WABAMediaRecord'
      summary: Upload runtime media and generate phone-scoped Media ID
  /api/v1/whatsapp/templates:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.WABATemplateDefinition'
            type: array
      summary: List WABA Message Templates (Jasper's Market + Custom)
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.WABATemplateDefinition'
      summary: Create WABA Message Template (/{apiVersion}/{wabaId}/message_templates)
  /docs:
    get:
      produces:
      - text/html
      responses:
        "200":
          description: Swagger UI HTML
          schema:
            type: string
      summary: Interactive OpenAPI 3.0 Documentation
  /events:
    get:
      parameters:
      - description: Browser Tab Session ID
        in: query
        name: sessionId
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE Stream
          schema:
            type: string
      summary: Real-time HTMX SSE stream
  /webhook:
    get:
      parameters:
      - description: Must be subscribe
        in: query
        name: hub.mode
        required: true
        type: string
      - description: Verify Token configured in Setup
        in: query
        name: hub.verify_token
        required: true
        type: string
      - description: Challenge nonce echoed back on 200 OK
        in: query
        name: hub.challenge
        required: true
        type: string
      responses:
        "200":
          description: hub.challenge
          schema:
            type: string
      summary: Verify WhatsApp Webhook Subscription (hub.verify_token & hub.challenge)
    post:
      consumes:
      - application/json
      produces:
      - text/plain
      responses:
        "200":
          description: EVENT_RECEIVED
          schema:
            type: string
      summary: Receive WhatsApp Cloud API Webhook events (messages & statuses)
swagger: "2.0"
